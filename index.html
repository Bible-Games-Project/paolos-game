<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#10152e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>¡Al Arca! — Bible Games Project</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #10152e;
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: fixed;
      inset: 0;
      display: block;
      touch-action: none;
    }
    #safe {
      position: fixed;
      top: 0;
      left: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="safe"></div>
  <script>
  (() => {
    'use strict';

    // ---------- Setup ----------
    const cvs = document.getElementById('game');
    const ctx = cvs.getContext('2d');
    const safeEl = document.getElementById('safe');

    const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
    const UI_FONT = '"Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif';
    const ANIMALS = ['🦁', '🐘', '🦒', '🐒', '🐧', '🐢', '🐑', '🐄', '🐇', '🦊', '🐻', '🐼', '🦓', '🐊', '🐫', '🐷'];
    const RAINBOW = ['#ff4d4d', '#ff9f3d', '#ffe84d', '#5cd65c', '#4da6ff', '#7a5cff', '#c45cff'];
    const MAX_LIVES = 5;

    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];

    function load(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, String(value)); } catch (e) { /* storage unavailable */ }
    }

    // ---------- State ----------
    let W = 0, H = 0, DPR = 1, U = 1, V = 1, seaY = 0, arkW = 0;
    let safeT = 0, safeR = 0, safeL = 0;
    let state = 'title'; // title | play | over
    let time = 0, elapsed = 0;
    let score = 0, best = +load('alarca.best', 0) || 0, lives = 3, saved = 0, pairs = 0, streak = 0;
    let lastSpecies = null, newRecord = false;
    let spawnT = 0, pending = [];
    let objs = [], parts = [], texts = [], floaters = [];
    let shake = 0, flash = 0, hurt = 0, invuln = 0, rainbowT = 0, squash = 0, scorePop = 0, overT = 0, clear = 0;
    let lightT = 2.5, boltFx = null;
    const ark = { x: 0, tx: 0, y: 0, rot: 0, vx: 0, windows: [null, null, null], pop: [0, 0, 0], wIdx: 0 };
    const keys = { left: false, right: false };
    let skyGrad = null, clearGrad = null, seaGrad = null;
    let clouds = [], mountains = [], rain = [];

    // ---------- Emoji sprites (pre-rendered for speed) ----------
    const spriteCache = new Map();
    function sprite(emoji, size, glow) {
      size = Math.max(4, Math.round(size));
      const key = emoji + '|' + size + '|' + (glow || '');
      let c = spriteCache.get(key);
      if (c) return c;
      const pad = glow ? size * 0.45 : size * 0.15;
      const dim = size + pad * 2;
      c = document.createElement('canvas');
      c.width = c.height = Math.ceil(dim * DPR);
      const g = c.getContext('2d');
      g.scale(DPR, DPR);
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = size + 'px ' + EMOJI_FONT;
      if (glow) { g.shadowColor = glow; g.shadowBlur = size * 0.35 * DPR; }
      g.fillText(emoji, dim / 2, dim / 2 + size * 0.06);
      if (glow) g.fillText(emoji, dim / 2, dim / 2 + size * 0.06);
      c.dim = dim;
      spriteCache.set(key, c);
      return c;
    }
    function drawSprite(emoji, x, y, size, rot, glow, alpha, sx, sy) {
      const s = sprite(emoji, size, glow);
      ctx.save();
      if (alpha !== undefined) ctx.globalAlpha *= alpha;
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      if (sx !== undefined) ctx.scale(sx, sy === undefined ? sx : sy);
      ctx.drawImage(s, -s.dim / 2, -s.dim / 2, s.dim, s.dim);
      ctx.restore();
    }

    // ---------- Text helpers ----------
    function text(str, x, y, size, fill, align, stroke) {
      ctx.font = '900 ' + size + 'px ' + UI_FONT;
      ctx.textAlign = align || 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      if (stroke !== null) {
        ctx.lineWidth = size * 0.2;
        ctx.strokeStyle = stroke || 'rgba(16,20,46,0.9)';
        ctx.strokeText(str, x, y);
      }
      ctx.fillStyle = fill || '#fff';
      ctx.fillText(str, x, y);
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---------- Audio (WebAudio, no files) ----------
    let actx = null, master = null, noiseBuf = null, rainGain = null;
    let muted = load('alarca.muted', '0') === '1';
    function initAudio() {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try { actx = new AC(); } catch (e) { return; }
        master = actx.createGain();
        master.gain.value = muted ? 0 : 0.9;
        master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        // Soft rain ambience
        const src = actx.createBufferSource();
        src.buffer = noiseBuf;
        src.loop = true;
        const f = actx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.5;
        rainGain = actx.createGain();
        rainGain.gain.value = 0.045;
        src.connect(f); f.connect(rainGain); rainGain.connect(master);
        src.start();
      }
      if (actx.state === 'suspended') actx.resume();
    }
    function tone(freq, dur, type, vol, slideTo, delay) {
      if (!actx || muted) return;
      const t = actx.currentTime + (delay || 0);
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.03);
    }
    function noise(dur, vol, filterType, freq, delay) {
      if (!actx || muted) return;
      const t = actx.currentTime + (delay || 0);
      const src = actx.createBufferSource();
      src.buffer = noiseBuf;
      const f = actx.createBiquadFilter();
      f.type = filterType; f.frequency.value = freq;
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t, Math.random()); src.stop(t + dur + 0.05);
    }
    const sfx = {
      catch(n) { const f = 520 * Math.pow(2, Math.min(n, 12) / 12); tone(f, 0.14, 'triangle', 0.25, f * 1.5); },
      pair() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.18, 'triangle', 0.22, null, i * 0.065)); },
      miss() { noise(0.3, 0.3, 'lowpass', 1400); tone(330, 0.35, 'sine', 0.15, 140); },
      hit() { noise(0.4, 0.6, 'lowpass', 900); tone(170, 0.35, 'sawtooth', 0.12, 55); },
      power() { [660, 880, 1175, 1568].forEach((f, i) => tone(f, 0.22, 'sine', 0.2, null, i * 0.08)); },
      thunder(delay) { noise(1.8, 0.55, 'lowpass', 200, delay); noise(0.6, 0.25, 'lowpass', 600, delay); },
      start() { tone(392, 0.15, 'triangle', 0.2, 784); tone(784, 0.2, 'triangle', 0.15, 1175, 0.1); },
      over() { [523, 440, 349, 262].forEach((f, i) => tone(f, 0.3, 'triangle', 0.2, null, i * 0.16)); [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.5, 'sine', 0.12, null, 1.0 + i * 0.12)); },
    };
    function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* not supported */ } }
    function toggleMute() {
      muted = !muted;
      save('alarca.muted', muted ? '1' : '0');
      if (master) master.gain.value = muted ? 0 : 0.9;
    }

    // ---------- Layout ----------
    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      cvs.width = Math.round(W * DPR);
      cvs.height = Math.round(H * DPR);
      cvs.style.width = W + 'px';
      cvs.style.height = H + 'px';
      U = Math.min(W, H * 0.62) / 400;
      V = H / 800;
      seaY = H * 0.82;
      arkW = Math.min(170 * U, W * 0.42);
      try {
        const cs = getComputedStyle(safeEl);
        safeT = parseFloat(cs.paddingTop) || 0;
        safeR = parseFloat(cs.paddingRight) || 0;
        safeL = parseFloat(cs.paddingLeft) || 0;
      } catch (e) { safeT = safeR = safeL = 0; }
      spriteCache.clear();
      buildScene();
      if (!ark.x) ark.x = ark.tx = W / 2;
      ark.x = clamp(ark.x, arkW / 2, W - arkW / 2);
      ark.tx = clamp(ark.tx, arkW / 2, W - arkW / 2);
    }

    function buildScene() {
      skyGrad = ctx.createLinearGradient(0, 0, 0, seaY);
      skyGrad.addColorStop(0, '#10152e');
      skyGrad.addColorStop(0.55, '#27355f');
      skyGrad.addColorStop(1, '#5a74a3');
      clearGrad = ctx.createLinearGradient(0, 0, 0, seaY);
      clearGrad.addColorStop(0, '#3d9be6');
      clearGrad.addColorStop(0.6, '#a9dcff');
      clearGrad.addColorStop(1, '#ffe7bf');
      seaGrad = ctx.createLinearGradient(0, seaY - 20 * U, 0, H);
      seaGrad.addColorStop(0, '#3a86cc');
      seaGrad.addColorStop(1, '#0f2b57');

      clouds = [];
      const n = Math.ceil(W / 110) + 3;
      for (let i = 0; i < n; i++) {
        const puffs = [];
        const pc = 5 + ((Math.random() * 3) | 0);
        for (let j = 0; j < pc; j++) puffs.push({ dx: rand(-55, 55), dy: rand(-14, 10), r: rand(22, 40) });
        clouds.push({
          x: rand(-120, W + 120), y: safeT + rand(-5, 55) * U, s: rand(0.8, 1.5) * U,
          sp: rand(5, 16) * U, col: pick(['#2a3155', '#323a62', '#3a4370']), puffs,
        });
      }

      mountains = [];
      for (let layer = 0; layer < 2; layer++) {
        const pts = [];
        const step = (layer ? 70 : 110) * U;
        for (let x = -step; x <= W + step; x += step) {
          pts.push([x + rand(-0.3, 0.3) * step, seaY - (layer ? rand(25, 70) : rand(60, 120)) * U]);
        }
        mountains.push(pts);
      }

      rain = [];
      const rc = Math.min(260, Math.round((W * H) / 5000));
      for (let i = 0; i < rc; i++) rain.push({ x: rand(0, W + H * 0.3), y: rand(-H, H), l: rand(10, 22) * V, sp: rand(650, 950) });
    }

    // ---------- Sea ----------
    function seaF(x) { return seaY + Math.sin(x * 0.011 / U + time * 1.5) * 7 * U + Math.sin(x * 0.029 / U - time * 2.3) * 3 * U; }
    function seaB(x) { return seaY - 14 * U + Math.sin(x * 0.009 / U - time * 1.1 + 1) * 8 * U + Math.sin(x * 0.021 / U + time * 1.7) * 3 * U; }
    function wavePath(fn, close) {
      const step = Math.max(8, W / 60);
      ctx.beginPath();
      if (close) ctx.moveTo(0, H); else ctx.moveTo(0, fn(0));
      for (let x = 0; x <= W + step; x += step) ctx.lineTo(x, fn(x));
      if (close) { ctx.lineTo(W + step, H); ctx.closePath(); }
    }

    // ---------- Game flow ----------
    function start() {
      state = 'play';
      score = 0; lives = 3; saved = 0; pairs = 0; streak = 0; elapsed = 0;
      lastSpecies = null; newRecord = false;
      objs = []; pending = []; floaters = []; texts = [];
      spawnT = 0.8; invuln = 0; rainbowT = 0; overT = 0; hurt = 0;
      ark.windows = [null, null, null];
      sfx.start();
    }

    function gameOver() {
      state = 'over';
      overT = 0;
      flash = 1;
      for (const o of objs) burst(o.cx, o.y, 8, ['#fff', '#bfe3ff'], { speed: 160, life: 0.6 });
      objs = []; pending = [];
      if (score > best) { best = score; newRecord = true; save('alarca.best', best); }
      sfx.over();
      vibrate([60, 60, 120]);
    }

    function difficulty() { return Math.min(1, elapsed / 100); }

    function spawnObj(kind, emoji, x) {
      const d = difficulty();
      const size = (kind === 'animal' ? 52 : 46) * U;
      const m = size * 0.7;
      const o = {
        kind, emoji, size,
        x: x === undefined ? rand(m, W - m) : clamp(x, m, W - m),
        y: -size,
        vy: (165 + 210 * d) * V * rand(0.9, 1.1) * (kind === 'bolt' ? 1.2 : 1),
        ph: rand(0, 6.28), sw: rand(3, 10) * U, rot: 0, cx: 0, y0: -size,
      };
      o.cx = o.x;
      objs.push(o);
      return o;
    }

    function spawnLogic(dt) {
      const d = difficulty();
      for (let i = pending.length - 1; i >= 0; i--) {
        pending[i].t -= dt;
        if (pending[i].t <= 0) { spawnObj('animal', pending[i].e, pending[i].x); pending.splice(i, 1); }
      }
      spawnT -= dt;
      if (spawnT > 0) return;
      spawnT = (1.05 - 0.6 * d) * rand(0.8, 1.2);
      const r = Math.random();
      const boltP = elapsed < 6 ? 0 : 0.1 + 0.25 * d;
      if (r < boltP) spawnObj('bolt', '⚡');
      else if (r < boltP + 0.03 && lives < MAX_LIVES && elapsed > 10) spawnObj('dove', '🕊️');
      else if (r < boltP + 0.055 && rainbowT <= 0 && elapsed > 15) spawnObj('rainbow', '🌈');
      else {
        const e = pick(ANIMALS);
        const o = spawnObj('animal', e);
        if (Math.random() < 0.5) pending.push({ t: rand(0.35, 0.7), e, x: o.x + rand(-1, 1) * W * 0.35 });
      }
    }

    function catchObj(o) {
      const mult = rainbowT > 0 ? 2 : 1;
      const topY = ark.y - arkW * 0.32 * 1.6;
      if (o.kind === 'animal') {
        saved++; streak++;
        let pts = mult;
        if (lastSpecies === o.emoji) {
          pairs++;
          pts += 5 * mult;
          lastSpecies = null;
          addText('¡PAREJA! +' + pts, ark.x, topY - 40 * U, 30 * U, '#ff8fc7', true);
          burst(o.cx, o.y, 14, ['💖'], { speed: 260, life: 1.1, size: 22 * U, shape: 'emoji' });
          burst(o.cx, o.y, 20, RAINBOW, { speed: 320, life: 0.9, shape: 'star' });
          sfx.pair();
          vibrate(30);
        } else {
          lastSpecies = o.emoji;
          addText('+' + pts, o.cx, o.y - 10 * U, 26 * U, '#fff6a8');
          sfx.catch(streak);
        }
        score += pts;
        scorePop = 1;
        burst(o.cx, o.y, 12, ['#fff6a8', '#ffffff', '#ffd166'], { speed: 220, life: 0.6, shape: 'star' });
        ark.wIdx = (ark.wIdx + 1) % 3;
        ark.windows[ark.wIdx] = o.emoji;
        ark.pop[ark.wIdx] = 1;
        squash = 1;
      } else if (o.kind === 'bolt') {
        if (invuln > 0) {
          burst(o.cx, o.y, 10, ['#ffe066', '#fff'], { speed: 200, life: 0.4 });
          return;
        }
        lives--; streak = 0;
        invuln = 1.3; shake = 16 * U; hurt = 1; flash = Math.max(flash, 0.5);
        burst(o.cx, o.y, 26, ['#ffe066', '#fff3b0', '#ffffff'], { speed: 380, life: 0.7, shape: 'star' });
        addText('¡AY!', ark.x, topY - 30 * U, 34 * U, '#ff6b6b');
        sfx.hit();
        vibrate(120);
        if (lives <= 0) gameOver();
      } else if (o.kind === 'dove') {
        lives = Math.min(MAX_LIVES, lives + 1);
        addText('+1 VIDA', ark.x, topY - 30 * U, 28 * U, '#ff9ecf');
        burst(o.cx, o.y, 10, ['❤️'], { speed: 220, life: 1, size: 20 * U, shape: 'emoji' });
        burst(o.cx, o.y, 16, ['#ffffff', '#c8f7c5'], { speed: 250, life: 0.8, shape: 'star' });
        sfx.power(); squash = 1;
      } else if (o.kind === 'rainbow') {
        rainbowT = 8;
        addText('¡PUNTOS x2!', ark.x, topY - 30 * U, 30 * U, '#fff', true);
        burst(o.cx, o.y, 30, RAINBOW, { speed: 360, life: 1, shape: 'star' });
        sfx.power(); squash = 1;
      }
    }

    function missObj(o) {
      const y = seaF(o.cx);
      burst(o.cx, y, 14, ['#d6ecff', '#ffffff', '#8cc4ff'], { speed: 230, life: 0.7, up: 260, g: 900 });
      parts.push({ shape: 'ring', x: o.cx, y, life: 0.6, max: 0.6, size: o.size * 0.5, color: '#ffffff' });
      if (o.kind === 'animal' && state === 'play') {
        floaters.push({ emoji: o.emoji, x: o.cx, vx: (o.cx < W / 2 ? -1 : 1) * rand(25, 45) * U, size: o.size * 0.8, life: 3.5, ph: rand(0, 6) });
        lives--; streak = 0;
        hurt = Math.max(hurt, 0.6); shake = Math.max(shake, 6 * U);
        addText('¡Oh no!', o.cx, y - 50 * U, 22 * U, '#bcd7ff');
        sfx.miss();
        vibrate(40);
        if (lives <= 0) gameOver();
      }
    }

    // ---------- Effects ----------
    function burst(x, y, n, colors, o) {
      o = o || {};
      for (let i = 0; i < n; i++) {
        const a = rand(0, Math.PI * 2);
        const sp = rand(0.35, 1) * (o.speed || 200) * U;
        const life = rand(0.6, 1) * (o.life || 0.7);
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 60) * U,
          g: (o.g === undefined ? 420 : o.g) * U, life, max: life,
          size: (o.size || rand(3, 6) * U) * rand(0.8, 1.2), color: pick(colors),
          shape: o.shape || 'dot', rot: rand(0, 6), vr: rand(-6, 6),
        });
      }
    }
    function confetti() {
      for (let i = 0; i < 6; i++) {
        parts.push({
          x: rand(0, W), y: -10, vx: rand(-40, 40) * U, vy: rand(80, 200) * U, g: 30 * U,
          life: 4, max: 4, size: rand(5, 9) * U, color: pick(RAINBOW), shape: 'rect', rot: rand(0, 6), vr: rand(-8, 8),
        });
      }
    }
    function addText(s, x, y, size, color, rainbow) {
      texts.push({ s, x: clamp(x, size * 2.5, W - size * 2.5), y, size, color, rainbow: !!rainbow, life: 1.2, max: 1.2 });
    }

    // ---------- Update ----------
    function update(dt) {
      time += dt;

      // Ambient: clouds, rain, lightning
      for (const c of clouds) {
        c.x += c.sp * dt;
        if (c.x - 80 * c.s > W) c.x = -90 * c.s;
      }
      for (const r of rain) {
        r.y += r.sp * dt * V;
        r.x -= r.sp * 0.22 * dt * V;
        if (r.y > H) { r.y = -r.l - rand(0, 40); r.x = rand(0, W + H * 0.3); }
      }
      clear = state === 'over' ? Math.min(1, clear + dt * 0.45) : Math.max(0, clear - dt * 1.5);
      if (rainGain) rainGain.gain.value = 0.045 * (1 - clear);
      if (clear < 0.3) {
        lightT -= dt;
        if (lightT <= 0) {
          lightT = rand(4.5, 10);
          flash = Math.max(flash, 0.8);
          const pts = [];
          let x = rand(W * 0.1, W * 0.9), y = safeT + 40 * U;
          const end = seaY - rand(10, 40) * U;
          const segs = 9;
          for (let i = 0; i <= segs; i++) { pts.push([x, y]); x += rand(-26, 26) * U; y += (end - safeT - 40 * U) / segs; }
          boltFx = { pts, life: 0.32 };
          sfx.thunder(rand(0.15, 0.5));
        }
      }
      if (boltFx) { boltFx.life -= dt; if (boltFx.life <= 0) boltFx = null; }

      // Ark movement
      const prevX = ark.x;
      if (state === 'play') {
        if (keys.left) ark.tx -= 700 * U * dt;
        if (keys.right) ark.tx += 700 * U * dt;
      } else if (state === 'title') {
        ark.tx = W / 2 + Math.sin(time * 0.6) * W * 0.18;
      }
      ark.tx = clamp(ark.tx, arkW / 2, W - arkW / 2);
      ark.x += (ark.tx - ark.x) * Math.min(1, dt * (state === 'play' ? 14 : 3));
      ark.x = clamp(ark.x, arkW / 2, W - arkW / 2);
      ark.vx = dt > 0 ? (ark.x - prevX) / dt : 0;
      const wl = (seaF(ark.x - arkW * 0.3) + seaF(ark.x) + seaF(ark.x + arkW * 0.3)) / 3;
      ark.y = wl - arkW * 0.32 * 0.05;
      const slope = Math.atan2(seaF(ark.x + arkW * 0.35) - seaF(ark.x - arkW * 0.35), arkW * 0.7);
      ark.rot = slope * 0.8 + clamp(-ark.vx * 0.00015 / U, -0.14, 0.14);

      // Gameplay
      if (state === 'play') {
        elapsed += dt;
        spawnLogic(dt);
      }
      const h = arkW * 0.32;
      const zoneTop = ark.y - h * 1.85, zoneBot = ark.y - h * 0.2;
      for (let i = objs.length - 1; i >= 0; i--) {
        const o = objs[i];
        o.y += o.vy * dt;
        o.cx = o.x + Math.sin(time * 2.2 + o.ph) * o.sw;
        o.rot = Math.sin(time * 3 + o.ph) * (o.kind === 'bolt' ? 0.15 : 0.3);
        const r = o.size * 0.4;
        if (state === 'play' && o.y + r > zoneTop && o.y - r < zoneBot && Math.abs(o.cx - ark.x) < arkW * 0.5 + r * 0.4) {
          objs.splice(i, 1);
          catchObj(o);
          if (state !== 'play') break;
          continue;
        }
        if (o.y - r * 0.5 > seaF(o.cx)) {
          objs.splice(i, 1);
          missObj(o);
          if (state !== 'play') break;
        }
      }

      for (let i = floaters.length - 1; i >= 0; i--) {
        const f = floaters[i];
        f.x += f.vx * dt; f.life -= dt;
        if (f.life <= 0) floaters.splice(i, 1);
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
        if (p.life <= 0) parts.splice(i, 1);
      }
      for (let i = texts.length - 1; i >= 0; i--) {
        const t = texts[i];
        t.y -= 55 * U * dt; t.life -= dt;
        if (t.life <= 0) texts.splice(i, 1);
      }

      if (state === 'over') {
        overT += dt;
        if (newRecord && overT < 3.5) confetti();
      }

      shake = Math.max(0, shake - dt * 40 * U);
      flash = Math.max(0, flash - dt * 2.5);
      hurt = Math.max(0, hurt - dt * 2.2);
      invuln = Math.max(0, invuln - dt);
      rainbowT = Math.max(0, rainbowT - dt);
      squash = Math.max(0, squash - dt * 5);
      scorePop = Math.max(0, scorePop - dt * 4);
      for (let i = 0; i < 3; i++) ark.pop[i] = Math.max(0, ark.pop[i] - dt * 4);
    }

    // ---------- Render ----------
    function drawRainbow(cx, cy, R, alpha, thick) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.lineWidth = thick + 1;
      for (let i = 0; i < RAINBOW.length; i++) {
        ctx.strokeStyle = RAINBOW[i];
        ctx.beginPath();
        ctx.arc(cx, cy, R - i * thick, Math.PI, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBackground() {
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, seaY + 30 * U);
      if (clear > 0) {
        ctx.globalAlpha = clear;
        ctx.fillStyle = clearGrad;
        ctx.fillRect(0, 0, W, seaY + 30 * U);
        // Sun
        const sx = W * 0.8, sy = safeT + 90 * U;
        ctx.fillStyle = 'rgba(255,230,120,0.35)';
        ctx.beginPath(); ctx.arc(sx, sy, 50 * U, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe066';
        ctx.beginPath(); ctx.arc(sx, sy, 32 * U, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Rainbows
      if (rainbowT > 0) drawRainbow(W / 2, seaY, Math.min(W * 0.6, H * 0.55), Math.min(1, rainbowT) * 0.4, 10 * U);
      if (clear > 0) drawRainbow(W / 2, seaY, Math.min(W * 0.75, H * 0.62), clear * 0.85, 13 * U);

      // Mountains
      const mcol = [['#3b4d7d', '#7fb07a'], ['#28375f', '#4f8a55']];
      for (let l = 0; l < mountains.length; l++) {
        const pts = mountains[l];
        ctx.beginPath();
        ctx.moveTo(0, seaY + 10 * U);
        for (let i = 0; i < pts.length; i++) {
          const [x, y] = pts[i];
          if (i === 0) ctx.lineTo(x, y);
          else {
            const [px, py] = pts[i - 1];
            ctx.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2);
          }
        }
        ctx.lineTo(W, seaY + 10 * U);
        ctx.closePath();
        ctx.fillStyle = mcol[l][0];
        ctx.fill();
        if (clear > 0) { ctx.globalAlpha = clear * 0.9; ctx.fillStyle = mcol[l][1]; ctx.fill(); ctx.globalAlpha = 1; }
      }

      // Clouds
      const cloudAlpha = 1 - clear * 0.75;
      for (const c of clouds) {
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath();
          for (const p of c.puffs) {
            const x = c.x + p.dx * c.s, y = c.y + (p.dy + (pass ? 0 : 10)) * c.s;
            ctx.moveTo(x + p.r * c.s, y);
            ctx.arc(x, y, p.r * c.s, 0, Math.PI * 2);
          }
          ctx.globalAlpha = cloudAlpha;
          ctx.fillStyle = pass ? (clear > 0.5 ? '#ffffff' : c.col) : 'rgba(10,12,30,0.45)';
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Lightning
      if (flash > 0) {
        ctx.fillStyle = 'rgba(225,232,255,' + (flash * 0.4) + ')';
        ctx.fillRect(0, 0, W, seaY + 30 * U);
      }
      if (boltFx) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, boltFx.life * 5);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3.5 * U;
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#cfe0ff';
        ctx.shadowBlur = 18 * U;
        ctx.beginPath();
        boltFx.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawArk() {
      const w = arkW, h = w * 0.32;
      ctx.save();
      ctx.translate(ark.x, ark.y);
      ctx.rotate(ark.rot);
      ctx.scale(1 + squash * 0.07, 1 - squash * 0.1);
      if (invuln > 0 && Math.floor(time * 16) % 2 === 0) ctx.globalAlpha = 0.45;

      const cTop = -h * 1.35, cBot = -h * 0.5;
      // Cabin
      roundRect(-w * 0.3, cTop, w * 0.6, cBot - cTop, 3 * U);
      ctx.fillStyle = '#b67d42';
      ctx.fill();
      ctx.strokeStyle = 'rgba(70,35,10,0.28)';
      ctx.lineWidth = 1.5 * U;
      ctx.beginPath();
      for (let k = -2; k <= 2; k++) { ctx.moveTo(-w * 0.27 + (k + 2) * w * 0.135, cTop + 2 * U); ctx.lineTo(-w * 0.27 + (k + 2) * w * 0.135, cBot); }
      ctx.stroke();

      // Windows with the last rescued animals
      const ws = h * 0.48, wy = (cTop + cBot) / 2 - h * 0.05;
      const wx = [-w * 0.18, 0, w * 0.18];
      for (let i = 0; i < 3; i++) {
        roundRect(wx[i] - ws / 2, wy - ws / 2, ws, ws, ws * 0.22);
        ctx.fillStyle = '#ffbe55';
        ctx.fill();
        ctx.lineWidth = 2.2 * U;
        ctx.strokeStyle = '#6e3e18';
        ctx.stroke();
        if (ark.windows[i]) {
          const s = 1 + ark.pop[i] * 0.6;
          drawSprite(ark.windows[i], wx[i], wy + ws * 0.05 - ark.pop[i] * ws * 0.3, ws * 1.05, Math.sin(time * 3 + i) * 0.12, null, 1, s, s);
        }
      }

      // Roof
      const rH = h * 0.5;
      ctx.beginPath();
      ctx.moveTo(-w * 0.38, cTop + 3 * U);
      ctx.lineTo(-w * 0.23, cTop - rH);
      ctx.lineTo(w * 0.23, cTop - rH);
      ctx.lineTo(w * 0.38, cTop + 3 * U);
      ctx.closePath();
      ctx.fillStyle = '#7b431c';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.22)';
      ctx.lineWidth = 1.5 * U;
      ctx.beginPath();
      ctx.moveTo(-w * 0.31, cTop - rH * 0.45); ctx.lineTo(w * 0.31, cTop - rH * 0.45);
      ctx.stroke();
      ctx.strokeStyle = '#a5632f';
      ctx.lineWidth = 3 * U;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-w * 0.23, cTop - rH); ctx.lineTo(w * 0.23, cTop - rH);
      ctx.stroke();
      if (rainbowT > 0 || clear > 0.5) drawSprite('🕊️', w * 0.12, cTop - rH - h * 0.28, h * 0.55, Math.sin(time * 2) * 0.1);

      // Hull
      ctx.beginPath();
      ctx.moveTo(-w * 0.53, -h * 0.9);
      ctx.quadraticCurveTo(-w * 0.47, h * 0.35, -w * 0.22, h * 0.35);
      ctx.lineTo(w * 0.22, h * 0.35);
      ctx.quadraticCurveTo(w * 0.47, h * 0.35, w * 0.53, -h * 0.9);
      ctx.quadraticCurveTo(w * 0.45, -h * 0.55, w * 0.38, -h * 0.55);
      ctx.lineTo(-w * 0.38, -h * 0.55);
      ctx.quadraticCurveTo(-w * 0.45, -h * 0.55, -w * 0.53, -h * 0.9);
      ctx.closePath();
      const hg = ctx.createLinearGradient(0, -h, 0, h * 0.4);
      hg.addColorStop(0, '#a26a36');
      hg.addColorStop(1, '#55300f');
      ctx.fillStyle = hg;
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = 'rgba(40,18,4,0.35)';
      ctx.lineWidth = 1.6 * U;
      ctx.beginPath();
      for (const yy of [-h * 0.3, -h * 0.05, h * 0.2]) { ctx.moveTo(-w * 0.6, yy); ctx.lineTo(w * 0.6, yy); }
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = '#d29a5d';
      ctx.lineWidth = 3 * U;
      ctx.beginPath();
      ctx.moveTo(-w * 0.53, -h * 0.9);
      ctx.quadraticCurveTo(-w * 0.45, -h * 0.55, -w * 0.38, -h * 0.55);
      ctx.lineTo(w * 0.38, -h * 0.55);
      ctx.quadraticCurveTo(w * 0.45, -h * 0.55, w * 0.53, -h * 0.9);
      ctx.stroke();

      ctx.restore();
    }

    function drawWorld() {
      // Back waves
      wavePath(seaB, true);
      ctx.fillStyle = clear > 0.5 ? '#2f7fc4' : '#1d4677';
      ctx.fill();

      // Animals that fell in the water float away
      for (const f of floaters) {
        const a = Math.min(1, f.life);
        drawSprite(f.emoji, f.x, seaB(f.x) - f.size * 0.1, f.size, Math.sin(time * 2 + f.ph) * 0.3, null, a);
      }

      drawArk();

      // Landing shadows on the water
      for (const o of objs) {
        const p = clamp((o.y + o.size) / (seaY + o.size), 0, 1);
        ctx.fillStyle = o.kind === 'bolt' ? 'rgba(255,90,60,' + (p * 0.45) + ')' : 'rgba(0,10,40,' + (p * 0.3) + ')';
        ctx.beginPath();
        ctx.ellipse(o.cx, seaF(o.cx) + 4 * U, o.size * 0.5 * (0.4 + p * 0.6), o.size * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Falling things
      for (const o of objs) {
        const glow = o.kind === 'bolt' ? '#ffd23f' : o.kind === 'animal' ? 'rgba(255,255,255,0.95)' : '#ffffff';
        const pulse = o.kind === 'bolt' ? 1 + Math.sin(time * 18 + o.ph) * 0.08 : 1;
        drawSprite(o.emoji, o.cx, o.y, o.size, o.rot, glow, 1, pulse, pulse);
      }

      // Front wave
      wavePath(seaF, true);
      ctx.fillStyle = seaGrad;
      ctx.fill();
      wavePath(seaF, false);
      ctx.strokeStyle = 'rgba(220,240,255,0.55)';
      ctx.lineWidth = 3 * U;
      ctx.stroke();

      // Rain
      if (clear < 1) {
        ctx.strokeStyle = 'rgba(190,210,255,' + (0.38 * (1 - clear)) + ')';
        ctx.lineWidth = 1.3 * U;
        ctx.beginPath();
        for (const r of rain) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + r.l * 0.22, r.y - r.l); }
        ctx.stroke();
      }

      // Particles
      for (const p of parts) {
        const a = clamp(p.life / p.max, 0, 1);
        ctx.globalAlpha = a;
        if (p.shape === 'emoji') {
          drawSprite(p.color, p.x, p.y, p.size, p.rot * 0.2);
        } else if (p.shape === 'ring') {
          const k = 1 - a;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2.5 * U;
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.size * (0.6 + k * 1.6), p.size * (0.15 + k * 0.4), 0, 0, Math.PI * 2);
          ctx.stroke();
        } else if (p.shape === 'star') {
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          const s = p.size * 1.4;
          ctx.beginPath();
          ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s);
          ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s);
          ctx.fill();
          ctx.restore();
        } else if (p.shape === 'rect') {
          ctx.fillStyle = p.color;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
          ctx.restore();
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;

      // Floating texts
      for (const t of texts) {
        const age = t.max - t.life;
        const s = age < 0.15 ? 0.5 + (age / 0.15) * 0.7 : 1.2 - Math.min(0.2, (age - 0.15));
        ctx.globalAlpha = clamp(t.life / 0.4, 0, 1);
        const col = t.rainbow ? RAINBOW[Math.floor(time * 12) % RAINBOW.length] : t.color;
        text(t.s, t.x, t.y, t.size * s, col);
      }
      ctx.globalAlpha = 1;
    }

    function muteButton() {
      const r = 20 * U;
      return { x: W - safeR - 16 * U - r, y: safeT + 16 * U + r, r };
    }

    function drawHUD() {
      const top = safeT + 16 * U + 20 * U;
      // Hearts
      const slots = Math.max(3, lives);
      for (let i = 0; i < slots; i++) {
        const filled = i < lives;
        const beat = filled && lives === 1 ? 1 + Math.sin(time * 10) * 0.12 : 1;
        drawSprite('❤️', safeL + 26 * U + i * 30 * U, top, 26 * U, 0, null, filled ? 1 : 0.22, beat, beat);
      }
      // Score
      const s = 1 + scorePop * 0.35;
      text(String(score), W / 2, top + 2 * U, 42 * U * s, rainbowT > 0 ? RAINBOW[Math.floor(time * 10) % RAINBOW.length] : '#ffffff');
      if (rainbowT > 0) {
        ctx.font = '900 ' + (42 * U) + 'px ' + UI_FONT;
        const sw = ctx.measureText(String(score)).width;
        text('x2', W / 2 + sw / 2 + 24 * U, top + 4 * U, 22 * U, '#fff3b0');
      }
      // Pair hint: "lion + ghost lion"
      if (lastSpecies && state === 'play') {
        const y = top + 44 * U;
        roundRect(W / 2 - 52 * U, y - 18 * U, 104 * U, 36 * U, 18 * U);
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fill();
        drawSprite(lastSpecies, W / 2 - 28 * U, y, 26 * U);
        text('+', W / 2, y, 20 * U, '#ffd6ec', 'center', null);
        drawSprite(lastSpecies, W / 2 + 28 * U, y, 26 * U, 0, null, 0.35 + Math.sin(time * 6) * 0.2);
      }
      // Mute button
      const m = muteButton();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      drawSprite(muted ? '🔇' : '🔊', m.x, m.y, 20 * U);
    }

    function drawTitle() {
      const cx = W / 2;
      const ty = H * 0.17;
      const size = Math.min(78 * U, W * 0.17);
      ctx.save();
      ctx.translate(cx, ty + Math.sin(time * 2) * 4 * U);
      ctx.rotate(Math.sin(time * 1.3) * 0.03);
      const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
      g.addColorStop(0, '#fff6c2');
      g.addColorStop(1, '#ffb703');
      text('¡AL ARCA!', 0, 5 * U, size, 'rgba(0,0,0,0.35)', 'center', 'rgba(0,0,0,0.35)');
      text('¡AL ARCA!', 0, 0, size, g, 'center', '#1a1f3d');
      ctx.restore();
      text('Salva a los animales del diluvio', cx, ty + size * 0.62, 17 * U, '#e6ecff', 'center', 'rgba(16,20,46,0.7)');

      const pw = Math.min(W - 32, 320 * U), ph = 150 * U;
      const py = ty + size * 0.62 + 26 * U;
      roundRect(cx - pw / 2, py, pw, ph, 18 * U);
      ctx.fillStyle = 'rgba(255,255,255,0.13)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1.5 * U;
      ctx.stroke();
      const rows = [
        [['🦁'], 'Atrapa a los animales'],
        [['⚡'], 'Esquiva los rayos'],
        [['🐘', '🐘'], 'Dos iguales seguidos: +5'],
      ];
      const ix = cx - pw / 2 + 38 * U;
      rows.forEach(([ems, label], i) => {
        const y = py + 28 * U + i * 47 * U;
        if (ems.length === 1) drawSprite(ems[0], ix, y, 30 * U, Math.sin(time * 3 + i) * 0.15, ems[0] === '⚡' ? '#ffd23f' : null);
        else { drawSprite(ems[0], ix - 9 * U, y, 24 * U); drawSprite(ems[1], ix + 9 * U, y, 24 * U); }
        text(label, ix + 30 * U, y, 17 * U, '#ffffff', 'left', 'rgba(16,20,46,0.6)');
      });

      const pulse = 1 + Math.sin(time * 5) * 0.06;
      text('TOCA PARA JUGAR', cx, py + ph + 40 * U, 27 * U * pulse, '#ffe066');
      let y2 = py + ph + 74 * U;
      if (best > 0) { text('Récord: ' + best, cx, y2, 17 * U, '#ffffff'); y2 += 24 * U; }
      text('Desliza el dedo para mover el arca', cx, y2, 14 * U, '#c9d4ff', 'center', 'rgba(16,20,46,0.6)');
    }

    function drawOver() {
      const a = Math.min(1, overT * 2);
      ctx.fillStyle = 'rgba(10,15,40,' + (0.35 * a) + ')';
      ctx.fillRect(0, 0, W, H);

      // A dove crossing the sky with an olive branch
      const dx = ((overT * 70 * U) % (W + 160 * U)) - 80 * U;
      drawSprite('🕊️', dx, safeT + 70 * U + Math.sin(overT * 3) * 10 * U, 40 * U, Math.sin(overT * 4) * 0.1);

      const cx = W / 2;
      const pw = Math.min(W - 32, 330 * U), ph = 300 * U;
      const ease = 1 - Math.pow(1 - Math.min(1, overT * 2.5), 3);
      const py = H * 0.13 + (1 - ease) * 60 * U;
      ctx.globalAlpha = ease;
      roundRect(cx - pw / 2, py, pw, ph, 22 * U);
      ctx.fillStyle = 'rgba(20,28,70,0.82)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2 * U;
      ctx.stroke();

      text('¡SE ACABÓ!', cx, py + 38 * U, 32 * U, '#ffffff');
      text(String(score), cx, py + 98 * U, 66 * U, '#ffd23f');
      text('puntos', cx, py + 138 * U, 16 * U, '#c9d4ff', 'center', null);
      text('Animales salvados: ' + saved, cx, py + 170 * U, 18 * U, '#ffffff', 'center', null);
      text('Parejas: ' + pairs, cx, py + 196 * U, 18 * U, '#ffb3d9', 'center', null);
      if (newRecord) {
        const s = 1 + Math.sin(time * 8) * 0.07;
        text('¡NUEVO RÉCORD!', cx, py + 230 * U, 22 * U * s, RAINBOW[Math.floor(time * 10) % RAINBOW.length]);
      } else {
        text('Récord: ' + best, cx, py + 230 * U, 18 * U, '#e6ecff', 'center', null);
      }
      ctx.font = 'italic 600 ' + (14 * U) + 'px ' + UI_FONT;
      ctx.fillStyle = '#d7e3ff';
      ctx.textAlign = 'center';
      ctx.fillText('«Mi arco he puesto en las nubes»', cx, py + 262 * U);
      ctx.font = '700 ' + (12 * U) + 'px ' + UI_FONT;
      ctx.fillStyle = '#9fb2e6';
      ctx.fillText('Génesis 9:13', cx, py + 282 * U);
      ctx.globalAlpha = 1;

      if (overT > 1) {
        const pulse = 1 + Math.sin(time * 5) * 0.06;
        text('TOCA PARA REPETIR', cx, py + ph + 38 * U, 25 * U * pulse, '#ffe066');
      }
    }

    function render() {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.save();
      if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
      drawBackground();
      drawWorld();
      ctx.restore();

      if (state === 'play' || state === 'over') drawHUD();
      if (state === 'title') { drawTitle(); drawHUD_muteOnly(); }
      if (state === 'over') drawOver();

      if (hurt > 0) {
        ctx.fillStyle = 'rgba(255,40,60,' + (hurt * 0.28) + ')';
        ctx.fillRect(0, 0, W, H);
      }
      if (flash > 0.3 && state !== 'title') {
        ctx.fillStyle = 'rgba(255,255,255,' + ((flash - 0.3) * 0.25) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }
    function drawHUD_muteOnly() {
      const m = muteButton();
      ctx.fillStyle = 'rgba(255,255,255,0.16)';
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
      drawSprite(muted ? '🔇' : '🔊', m.x, m.y, 20 * U);
    }

    // ---------- Input ----------
    function onMuteButton(x, y) {
      const m = muteButton();
      return Math.hypot(x - m.x, y - m.y) < m.r + 10 * U;
    }
    cvs.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      initAudio();
      const x = e.clientX, y = e.clientY;
      if (onMuteButton(x, y)) { toggleMute(); return; }
      if (state === 'title') start();
      else if (state === 'over') { if (overT > 1) start(); else return; }
      ark.tx = x;
    });
    cvs.addEventListener('pointermove', (e) => {
      if (state === 'play') ark.tx = e.clientX;
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === ' ' || e.key === 'Enter') {
        initAudio();
        if (state === 'title' || (state === 'over' && overT > 1)) start();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));

    // ---------- Loop ----------
    resize();
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      update(dt);
      render();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
